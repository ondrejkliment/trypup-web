  <circle cx="100" cy="417" r="11" fill="#F2784B"/><text x="140" y="430" font-size="42" font-weight="400" fill="#2A1E28">Skutečné GPS procházky</text>
  <circle cx="100" cy="497" r="11" fill="#F2784B"/><text x="140" y="510" font-size="42" font-weight="400" fill="#2A1E28">Krmení, výcvik &amp; hra</text>
