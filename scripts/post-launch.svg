<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Helvetica, Arial, sans-serif">
  <defs><clipPath id="hc"><ellipse cx="100" cy="92" rx="58" ry="54"/></clipPath></defs>
  <rect width="1080" height="1080" fill="#FDF4EF"/>
  <rect x="0" y="0" width="1080" height="14" fill="#4A2B45"/>

  <!-- velký mascot watermark vpravo dole -->
  <g transform="translate(640,560) scale(3.4)" opacity="0.07">
    <ellipse cx="48" cy="112" rx="20" ry="52" transform="rotate(-10 48 112)" fill="#4A2B45"/>
    <ellipse cx="152" cy="112" rx="20" ry="52" transform="rotate(10 152 112)" fill="#4A2B45"/>
    <ellipse cx="100" cy="92" rx="58" ry="54" fill="#4A2B45"/>
    <ellipse cx="100" cy="127" rx="38" ry="31" fill="#4A2B45"/>
  </g>

  <!-- logo: hlava-mark centered -->
  <g transform="translate(430,150) scale(1.1)">
    <ellipse cx="48" cy="112" rx="20" ry="52" transform="rotate(-10 48 112)" fill="#4A2B45"/>
    <ellipse cx="152" cy="112" rx="20" ry="52" transform="rotate(10 152 112)" fill="#4A2B45"/>
    <ellipse cx="100" cy="92" rx="58" ry="54" fill="#C77A45"/>
    <ellipse cx="68" cy="80" rx="32" ry="34" fill="#9A5A2E" clip-path="url(#hc)"/>
    <ellipse cx="100" cy="127" rx="38" ry="31" fill="#FDF4EF" stroke="#B0682F" stroke-width="2.5"/>
    <circle cx="78" cy="86" r="9" fill="#4A2B45"/><circle cx="122" cy="86" r="9" fill="#4A2B45"/>
    <circle cx="81" cy="83" r="3" fill="#FDF4EF"/><circle cx="125" cy="83" r="3" fill="#FDF4EF"/>
    <path d="M89 113 Q100 106 111 113 Q111 123 100 127 Q89 123 89 113 Z" fill="#4A2B45"/>
    <path d="M100 127 V134" stroke="#4A2B45" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M100 134 Q90 143 82 137" stroke="#4A2B45" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M100 134 Q110 143 118 137" stroke="#4A2B45" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- wordmark centered -->
  <text x="540" y="445" text-anchor="middle" font-size="84" font-weight="800"><tspan fill="#4A2B45">try</tspan><tspan fill="#F2784B">pup</tspan></text>

  <!-- claim -->
  <text x="540" y="585" text-anchor="middle" font-size="80" font-weight="800" fill="#4A2B45">Pes na zkoušku</text>
  <!-- tagline -->
  <text x="540" y="665" text-anchor="middle" font-size="34" font-weight="400" fill="#6E6A56">Vyzkoušej si péči o psa, dřív</text>
  <text x="540" y="712" text-anchor="middle" font-size="34" font-weight="400" fill="#6E6A56">než si pořídíš toho skutečného.</text>

  <!-- store CTA pill -->
  <g transform="translate(290,800)">
    <rect width="500" height="92" rx="46" fill="#F2784B"/>
    <text x="250" y="59" text-anchor="middle" font-size="34" font-weight="800" fill="#FDF4EF">Zdarma — už brzy</text>
  </g>
  <text x="540" y="940" text-anchor="middle" font-size="28" font-weight="600" fill="#3E7C8C">App Store &amp; Google Play</text>

  <!-- footer -->
  <text x="80" y="1015" font-size="30" font-weight="700" fill="#4A2B45">trypup.life</text>
  <text x="1000" y="1015" text-anchor="end" font-size="30" font-weight="600" fill="#8A7E84">@trypupapp</text>
</svg>
