<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FEF7ED"/>
  <rect x="0" y="0" width="1200" height="12" fill="#0369A1"/>

  <!-- big paw watermark, right -->
  <g transform="translate(815,150) scale(5.6)" fill="#D97706" opacity="0.09">
    <ellipse cx="32" cy="40" rx="11" ry="9"/>
    <ellipse cx="18" cy="28" rx="5" ry="6.5"/>
    <ellipse cx="27" cy="21" rx="5" ry="7"/>
    <ellipse cx="37" cy="21" rx="5" ry="7"/>
    <ellipse cx="46" cy="28" rx="5" ry="6.5"/>
  </g>

  <!-- brand: paw logo + wordmark, top-left -->
  <g transform="translate(80,72)">
    <rect width="60" height="60" rx="13" fill="#ffffff" stroke="#F3E9DC" stroke-width="2"/>
    <g fill="#D97706" transform="scale(0.94)">
      <ellipse cx="32" cy="40" rx="11" ry="9"/>
      <ellipse cx="18" cy="28" rx="5" ry="6.5"/>
      <ellipse cx="27" cy="21" rx="5" ry="7"/>
      <ellipse cx="37" cy="21" rx="5" ry="7"/>
      <ellipse cx="46" cy="28" rx="5" ry="6.5"/>
    </g>
    <text x="78" y="42" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#1F2937">Trypup</text>
  </g>

  <!-- headline -->
  <text x="80" y="300" font-family="Helvetica, Arial, sans-serif" font-size="74" font-weight="800" fill="#1F2937">Vyzkoušej si psa,</text>
  <text x="80" y="388" font-family="Helvetica, Arial, sans-serif" font-size="74" font-weight="800" fill="#D97706">než je pozdě.</text>

  <!-- subline -->
  <text x="82" y="456" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#6B7280">Virtuální pes na zkoušku. Zjisti, jestli na něj máš čas</text>
  <text x="82" y="496" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#6B7280">a sílu — dřív než ho přivedeš domů.</text>

  <!-- url pill -->
  <g transform="translate(82,536)">
    <rect width="228" height="46" rx="23" fill="#DBEAFE"/>
    <text x="114" y="31" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0369A1">trypup.life</text>
  </g>
</svg>
