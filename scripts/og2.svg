  <text x="172" y="128" font-size="58" font-weight="800"><tspan fill="#4A2B45">try</tspan><tspan fill="#F2784B">pup</tspan></text>

  <!-- headline -->
  <text x="72" y="296" font-size="78" font-weight="800" fill="#4A2B45">Vyzkoušej si psa,</text>
  <text x="72" y="384" font-size="78" font-weight="800" fill="#F2784B">než je pozdě.</text>

  <!-- subline -->
  <text x="74" y="452" font-size="30" font-weight="400" fill="#6E6A56">Virtuální pes na zkoušku. Zjisti, jestli na něj</text>
  <text x="74" y="492" font-size="30" font-weight="400" fill="#6E6A56">máš čas a sílu — dřív než ho přivedeš domů.</text>

  <!-- url pill -->
